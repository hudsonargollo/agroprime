# Mkt Hub on dedicated subdomains. The Hub runs with basePath=/mkt, so the
# root redirects into it. Exact server_name beats the *.clubemkt.digital wildcard.
server {
    listen 80;
    listen [::]:80;
    server_name mkt.clubemkt.digital;

    client_max_body_size 16M;

    location = / { return 302 https://$host/mkt; }

    location /mkt/_next/static/ {
        alias /root/ClubeMkt/agroprime/hub/.next/static/;
        expires 1y;
        add_header Cache-Control "public";
    }

    location /mkt {
        proxy_pass http://127.0.0.1:4074;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name hub.clubemkt.digital;

    return 301 https://mkt.clubemkt.digital$request_uri;
}
