# Serve the Hub at /mkt on the Agro-Prime domain, keep the existing site as-is.
# Exact server_name wins over the *.clubemkt.digital wildcard block (clubemkt-sites).
server {
    listen 80;
    listen [::]:80;
    server_name agroprime.clubemkt.digital;

    client_max_body_size 16M;

    # Hub (Next.js standalone, basePath /mkt)
    location /mkt {
        proxy_pass http://127.0.0.1:4074;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Existing site (same backend as the wildcard: Krikkit publication system)
    location / {
        proxy_pass http://172.17.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
